name: keycloak-k8s
runtime: yaml
description: Keycloak 26 and PostgreSQL on Kubernetes exposed via Kong Gateway and Cilium

configuration:
  kongVip:
    type: String
    default: 192.168.100.240
  keycloakAdminUser:
    type: String
    default: admin
  keycloakAdminPassword:
    type: String
    default: AdminMasterPassword123!
  postgresPassword:
    type: String
    default: KeycloakDbPassword123!

resources:
  # 1. Namespace
  keycloakNamespace:
    type: kubernetes:core/v1:Namespace
    properties:
      metadata:
        name: keycloak
        labels:
          app.kubernetes.io/name: keycloak
          app.kubernetes.io/part-of: identity-management

  # 2. Database Secret
  dbSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: keycloak-db-secret
        namespace: ${keycloakNamespace.metadata.name}
      type: Opaque
      stringData:
        POSTGRES_DB: keycloak
        POSTGRES_USER: keycloak
        POSTGRES_PASSWORD: ${postgresPassword}

  # 3. PostgreSQL Deployment
  postgresDeployment:
    type: kubernetes:apps/v1:Deployment
    properties:
      metadata:
        name: postgres
        namespace: ${keycloakNamespace.metadata.name}
        labels:
          app: postgres
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: postgres
        template:
          metadata:
            labels:
              app: postgres
          spec:
            containers:
              - name: postgres
                image: postgres:16-alpine
                ports:
                  - containerPort: 5432
                    name: postgres
                envFrom:
                  - secretRef:
                      name: ${dbSecret.metadata.name}
                resources:
                  limits:
                    memory: 512Mi
                    cpu: 500m
                  requests:
                    memory: 256Mi
                    cpu: 250m
                readinessProbe:
                  exec:
                    command:
                      - pg_isready
                      - -U
                      - keycloak
                      - -d
                      - keycloak
                  initialDelaySeconds: 5
                  periodSeconds: 10

  # 4. PostgreSQL Service
  postgresService:
    type: kubernetes:core/v1:Service
    properties:
      metadata:
        name: postgres
        namespace: ${keycloakNamespace.metadata.name}
        labels:
          app: postgres
      spec:
        ports:
          - port: 5432
            targetPort: 5432
            name: postgres
        selector:
          app: postgres

  # 5. Keycloak Admin Secret
  keycloakAdminSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: keycloak-admin-secret
        namespace: ${keycloakNamespace.metadata.name}
      type: Opaque
      stringData:
        KEYCLOAK_ADMIN: ${keycloakAdminUser}
        KEYCLOAK_ADMIN_PASSWORD: ${keycloakAdminPassword}

  # 6. Keycloak (Quarkus) Deployment
  keycloakDeployment:
    type: kubernetes:apps/v1:Deployment
    properties:
      metadata:
        name: keycloak
        namespace: ${keycloakNamespace.metadata.name}
        labels:
          app: keycloak
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: keycloak
        template:
          metadata:
            labels:
              app: keycloak
          spec:
            containers:
              - name: keycloak
                image: quay.io/keycloak/keycloak:26.1.0
                args:
                  - start
                ports:
                  - name: http
                    containerPort: 8080
                env:
                  - name: KEYCLOAK_ADMIN
                    valueFrom:
                      secretKeyRef:
                        name: ${keycloakAdminSecret.metadata.name}
                        key: KEYCLOAK_ADMIN
                  - name: KEYCLOAK_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: ${keycloakAdminSecret.metadata.name}
                        key: KEYCLOAK_ADMIN_PASSWORD
                  - name: KC_DB
                    value: postgres
                  - name: KC_DB_URL
                    value: jdbc:postgresql://postgres.keycloak.svc.cluster.local:5432/keycloak
                  - name: KC_DB_USERNAME
                    value: keycloak
                  - name: KC_DB_PASSWORD
                    value: ${postgresPassword}
                  - name: KC_HTTP_ENABLED
                    value: "true"
                  - name: KC_PROXY_HEADERS
                    value: xforwarded
                  - name: KC_HOSTNAME_STRICT
                    value: "false"
                  - name: KC_HEALTH_ENABLED
                    value: "true"
                readinessProbe:
                  httpGet:
                    path: /health/ready
                    port: 8080
                  initialDelaySeconds: 25
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /health/live
                    port: 8080
                  initialDelaySeconds: 40
                  periodSeconds: 20
                resources:
                  limits:
                    memory: 1024Mi
                    cpu: 1000m
                  requests:
                    memory: 512Mi
                    cpu: 500m
    options:
      dependsOn:
        - ${postgresDeployment}

  # 7. Keycloak Service
  keycloakService:
    type: kubernetes:core/v1:Service
    properties:
      metadata:
        name: keycloak
        namespace: ${keycloakNamespace.metadata.name}
        labels:
          app: keycloak
      spec:
        ports:
          - name: http
            port: 8080
            targetPort: 8080
        selector:
          app: keycloak

  # 8. Kong Ingress for Keycloak
  keycloakIngress:
    type: kubernetes:networking.k8s.io/v1:Ingress
    properties:
      metadata:
        name: keycloak-ingress
        namespace: ${keycloakNamespace.metadata.name}
        annotations:
          konghq.com/strip-path: "false"
          konghq.com/protocols: "http,https"
      spec:
        ingressClassName: kong
        rules:
          - host: keycloak.${kongVip}.nip.io
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: ${keycloakService.metadata.name}
                      port:
                        number: 8080

outputs:
  keycloakAdminUrl: http://keycloak.${kongVip}.nip.io/admin
  keycloakWellKnownUrl: http://keycloak.${kongVip}.nip.io/realms/lab-realm/.well-known/openid-configuration
  adminUsername: ${keycloakAdminUser}
