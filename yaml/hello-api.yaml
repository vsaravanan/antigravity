# filename : hello-api.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: backend
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hello-api-data
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/hello-api-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k8worker1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-api-data
  namespace: backend
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: hello-api-data
  resources:
    requests:
      storage: 10Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
  namespace: backend
  labels:
    app: hello-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hello-api
  template:
    metadata:
      labels:
        app: hello-api
    spec:
      containers:
        - name: hello-api
          image: k8master:5000/hello-api:latest
          imagePullPolicy: Always # This ensures it always pulls the latest
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database.url

            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database.user

            - name: SERVER_PORT
              value: "8000"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hello-api-data


---
apiVersion: v1
kind: Service
metadata:
  name: hello-api-svc
  namespace: backend
  labels:
    app: hello-api-svc      # <-- add this — must match ServiceMonitor's selector below
spec:
  type: NodePort
  selector:
    app: hello-api
  # sessionAffinity: ClientIP in real time it may be required for session
  # but we are Redis is already there to achieve this.
  # So it may not be required. but giving is more useful

  sessionAffinity: None
  ports:
    - name: http # <-- add this: ServiceMonitor's `port: http` matches this name, not the number
      port: 80 # Service port
      targetPort: 8000 # Pod port or container port
      nodePort: 30080 # External port (this works from host)
