# filename : hello-ui.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hello-ui-data
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/hello-ui-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k8worker1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-ui-data
  namespace: frontend
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: hello-ui-data
  resources:
    requests:
      storage: 10Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-ui
  namespace: frontend
  labels:
    app: hello-ui
spec:
  replicas: 1
  strategy:
    type: Recreate  
  selector:
    matchLabels:
      app: hello-ui
  template:
    metadata:
      labels:
        app: hello-ui
    spec:
      containers:
        - name: hello-ui
          image: k8master:5000/hello-ui:latest
          # imagePullPolicy: Always  # This ensures it always pulls the latest
          # args:
          #   - "--port"
          #   - "3030"
          env:
          - name: PORT
            value: "3030"
          ports:
            - containerPort: 3030
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hello-ui-data
---
apiVersion: v1
kind: Service
metadata:
  name: hello-ui-svc
  namespace: frontend
  labels:
    app: hello-ui-svc
spec:
  type: NodePort
  selector:
    app: hello-ui
  # sessionAffinity: None # use None for ui session stickiness
  ports:
    - name: http
      port: 3000         # Service port
      targetPort: 3030   # Pod port or container port
      nodePort: 30030    # External port (this works from host)
